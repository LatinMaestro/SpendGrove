name: Preview Prisma Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use migrate-all for the controlled isolated Preview migration or verify-all for a separately approved post-check"
        required: true
        default: migrate-all
        type: choice
        options:
          - migrate-all
          - verify-all
      confirmation:
        description: "Type RUN ISOLATED PREVIEW MIGRATIONS or VERIFY ISOLATED PREVIEW MIGRATIONS"
        required: true
        type: string
      expected_state_json:
        description: "Verify-all only: secret-safe pre-migration state captured by the approved migrate-all run"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: preview-prisma-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    name: Apply controlled migrations to isolated Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.NEON_PREVIEW_DIRECT_DATABASE_URL }}
      EXPECTED_STATE_JSON: ${{ inputs.expected_state_json }}
      EXPECTED_PREVIEW_PROJECT_ID: cold-field-54187673
      EXPECTED_PREVIEW_BRANCH_ID: br-sweet-flower-aj2ng7ix
      EXPECTED_PREVIEW_DATABASE: neondb
      EXPECTED_PREVIEW_DIRECT_HOST: ep-shy-mud-aj7fpz5c.c-3.us-east-2.aws.neon.tech
      EXPECTED_PREVIEW_POOLED_HOST: ep-shy-mud-aj7fpz5c-pooler.c-3.us-east-2.aws.neon.tech

    steps:
      - name: Confirm isolated Preview migration request
        run: |
          if [ "${{ inputs.mode }}" = "migrate-all" ] && [ "${{ inputs.confirmation }}" != "RUN ISOLATED PREVIEW MIGRATIONS" ]; then
            echo "Confirmation text did not match. No migration was run."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "verify-all" ] && [ "${{ inputs.confirmation }}" != "VERIFY ISOLATED PREVIEW MIGRATIONS" ]; then
            echo "Verification confirmation text did not match. No database action was run."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "verify-all" ] && [ -z "$EXPECTED_STATE_JSON" ]; then
            echo "Verify-all requires the secret-safe state from the original approved run. No database action was run."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Preview migrations may run only from main. No migration was run."
            exit 1
          fi
          echo "Isolated Preview ${{ inputs.mode }} request confirmed. Connection values will not be printed."

      - name: Check required Preview secrets are present
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "Missing required Preview database secret(s). No migration was run."
            exit 1
          fi
          if [ -n "${PRODUCTION_DATABASE_URL:-}" ] || [ -n "${NEON_PRODUCTION_DATABASE_URL:-}" ] || [ -n "${NEON_PRODUCTION_DIRECT_DATABASE_URL:-}" ]; then
            echo "A Production database variable is present. No migration was run."
            exit 1
          fi
          echo "Required Preview-only database secrets are present. Values are hidden. No Production secret is mapped."

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Confirm pinned isolated Preview identity
        run: node scripts/preview-database-identity.mjs

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Run secret-safe all-migration preflight
        if: ${{ inputs.mode == 'migrate-all' }}
        run: node scripts/preview-migration-integrity.mjs pre-all --state-file "$RUNNER_TEMP/preview-migration-state.json"

      - name: Apply repository migrations once
        if: ${{ inputs.mode == 'migrate-all' }}
        run: |
          if ! npx prisma migrate deploy --schema prisma/schema.prisma > "$RUNNER_TEMP/prisma-migrate-deploy.log" 2>&1; then
            echo "Preview migration failed. Prisma output is withheld to protect connection details. Do not retry automatically."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/prisma-migrate-deploy.log"

      - name: Run secret-safe all-migration postflight
        run: |
          if [ "${{ inputs.mode }}" = "verify-all" ]; then
            node scripts/preview-migration-integrity.mjs post-all --expected-state-json "$EXPECTED_STATE_JSON"
          else
            node scripts/preview-migration-integrity.mjs post-all --state-file "$RUNNER_TEMP/preview-migration-state.json"
          fi

      - name: Confirm isolated Preview migration completed
        run: |
          echo "Isolated Preview Prisma ${{ inputs.mode }} request completed successfully."
          echo "Pinned safe identity: project=$EXPECTED_PREVIEW_PROJECT_ID branch=$EXPECTED_PREVIEW_BRANCH_ID database=$EXPECTED_PREVIEW_DATABASE."
