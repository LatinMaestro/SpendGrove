name: Preview Prisma Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose migrate for a new approved migration or verify-only to check an already-applied migration"
        required: true
        default: migrate
        type: choice
        options:
          - migrate
          - verify-only
      confirmation:
        description: "Type RUN PREVIEW MIGRATION for migrate or VERIFY PREVIEW MIGRATION for verify-only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-prisma-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    name: Apply Prisma migrations to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.NEON_PREVIEW_DIRECT_DATABASE_URL }}
      PREVIEW_MIGRATION_NAME: 20260708090000_phase_4_recurring_budgets_foundation

    steps:
      - name: Confirm Preview-only migration request
        run: |
          if [ "${{ inputs.mode }}" = "migrate" ] && [ "${{ inputs.confirmation }}" != "RUN PREVIEW MIGRATION" ]; then
            echo "Confirmation text did not match. No migration was run."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "verify-only" ] && [ "${{ inputs.confirmation }}" != "VERIFY PREVIEW MIGRATION" ]; then
            echo "Verification confirmation text did not match. No database action was run."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Preview migrations may run only from main. No migration was run."
            exit 1
          fi
          echo "Preview ${{ inputs.mode }} request confirmed for $PREVIEW_MIGRATION_NAME. Secret values will not be printed."

      - name: Check required Preview secrets are present
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "Missing required Preview database secret(s). Check repository secrets."
            exit 1
          fi
          if [ -n "${PRODUCTION_DATABASE_URL:-}" ] || [ -n "${NEON_PRODUCTION_DATABASE_URL:-}" ] || [ -n "${NEON_PRODUCTION_DIRECT_DATABASE_URL:-}" ]; then
            echo "A Production database variable is present. No migration was run."
            exit 1
          fi
          echo "Required Preview-only database secrets are present. Values are hidden. No Production secret is mapped."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Run secret-safe pre-migration integrity checks
        if: ${{ inputs.mode == 'migrate' }}
        run: node scripts/preview-migration-integrity.mjs pre --migration "$PREVIEW_MIGRATION_NAME" --state-file "$RUNNER_TEMP/preview-migration-counts.json"

      - name: Apply Preview migrations
        if: ${{ inputs.mode == 'migrate' }}
        run: |
          if ! npx prisma migrate deploy --schema prisma/schema.prisma > "$RUNNER_TEMP/prisma-migrate-deploy.log" 2>&1; then
            echo "Preview migration failed. Prisma output is withheld to protect connection details. Do not retry automatically."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/prisma-migrate-deploy.log"

      - name: Run secret-safe post-migration integrity checks
        run: |
          if [ "${{ inputs.mode }}" = "verify-only" ]; then
            node scripts/preview-migration-integrity.mjs post --migration "$PREVIEW_MIGRATION_NAME" --expected-counts-json '{"User":1,"Category":51,"Transaction":1500,"ImportBatch":15,"ImportRow":1568,"Property":2,"LoanAccount":3,"LoanRepayment":23,"LoanReconciliationLink":22,"PropertyTransactionLink":6,"PropertyReportReview":11}'
          else
            node scripts/preview-migration-integrity.mjs post --migration "$PREVIEW_MIGRATION_NAME" --state-file "$RUNNER_TEMP/preview-migration-counts.json"
          fi

      - name: Confirm Preview migration completed
        run: echo "Preview Prisma ${{ inputs.mode }} request and secret-safe integrity checks completed successfully for $PREVIEW_MIGRATION_NAME."