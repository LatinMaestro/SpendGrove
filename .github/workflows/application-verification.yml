name: Application verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: application-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate manual target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be an exact lowercase 40-character commit SHA."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify manual checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$TARGET_SHA" ]]; then
            echo "Expected $TARGET_SHA but checked out $ACTUAL_SHA."
            exit 1
          fi

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full tests and optimized build
        run: npm run build
