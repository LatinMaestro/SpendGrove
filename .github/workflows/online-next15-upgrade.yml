name: Online Next.js 15 upgrade batch

on:
  push:
    branches:
      - phase-5/next15-security-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5/next15-security-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply approved dependency and compatibility changes
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packagePath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          packageJson.dependencies.next = "15.5.20";
          packageJson.dependencies.react = "19.1.8";
          packageJson.dependencies["react-dom"] = "19.1.8";
          packageJson.devDependencies["@types/react"] = "19.1.11";
          packageJson.devDependencies["@types/react-dom"] = "19.1.7";
          packageJson.devDependencies["eslint-config-next"] = "15.5.20";
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + "\n");

          const routeIds = {
            "app/api/account/loans/[loanId]/route.ts": "loanId",
            "app/api/account/import-profiles/[profileId]/route.ts": "profileId",
            "app/api/account/merchant-rules/aliases/[aliasId]/route.ts": "aliasId",
            "app/api/account/merchant-rules/rules/[ruleId]/route.ts": "ruleId",
            "app/api/account/properties/[propertyId]/route.ts": "propertyId",
            "app/api/account/properties/[propertyId]/activity/route.ts": "propertyId",
            "app/api/account/categories/[categoryId]/route.ts": "categoryId",
            "app/api/account/merchant-rules/profiles/[profileId]/route.ts": "profileId",
            "app/api/account/loan-repayments/[repaymentId]/candidates/route.ts": "repaymentId",
            "app/api/account/loan-repayments/[repaymentId]/reconciliation/route.ts": "repaymentId",
            "app/api/account/manual-transactions/[transactionId]/property-link/route.ts": "transactionId",
            "app/api/account/loan-repayments/[repaymentId]/route.ts": "repaymentId",
            "app/api/account/manual-transactions/[transactionId]/route.ts": "transactionId",
            "app/api/account/properties/[propertyId]/report-export/route.ts": "propertyId",
            "app/api/account/properties/[propertyId]/report-review/route.ts": "propertyId",
          };

          for (const [path, id] of Object.entries(routeIds)) {
            let source = fs.readFileSync(path, "utf8");
            const paramType = new RegExp(`params:\\s*\\{\\s*${id}: string;?\\s*\\}`, "g");
            let typeCount = 0;
            source = source.replace(paramType, () => {
              typeCount += 1;
              return `params: Promise<{ ${id}: string }>`;
            });
            if (typeCount === 0) throw new Error(`No route params type updated in ${path}`);
            const access = `params.${id}`;
            if (!source.includes(access)) throw new Error(`No route params access updated in ${path}`);
            source = source.replaceAll(access, `(await params).${id}`);
            fs.writeFileSync(path, source);
          }

          {
            const path = "app/loans/page.tsx";
            let source = fs.readFileSync(path, "utf8");
            source = source.replace(
              "  searchParams?: {\n    loanImport?: string | string[];\n    saved?: string | string[];\n  };",
              "  searchParams?: Promise<{\n    loanImport?: string | string[];\n    saved?: string | string[];\n  }>;",
            );
            source = source.replace(
              "export default function LoansPage({ searchParams }: Readonly<LoansPageProps>) {",
              "export default async function LoansPage({ searchParams }: Readonly<LoansPageProps>) {\n  const resolvedSearchParams = await searchParams;",
            );
            source = source.replaceAll("searchParams?.", "resolvedSearchParams?.");
            if (!source.includes("resolvedSearchParams")) throw new Error("Loans searchParams migration failed");
            fs.writeFileSync(path, source);
          }

          {
            const path = "app/transactions/page.tsx";
            let source = fs.readFileSync(path, "utf8");
            source = source.replace(
              "export default function TransactionsPage({ searchParams }: { searchParams?: { import?: string | string[]; count?: string | string[] } }) {",
              "export default async function TransactionsPage({ searchParams }: { searchParams?: Promise<{ import?: string | string[]; count?: string | string[] }> }) {\n  const resolvedSearchParams = await searchParams;",
            );
            source = source.replaceAll("searchParams?.", "resolvedSearchParams?.");
            if (!source.includes("resolvedSearchParams")) throw new Error("Transactions searchParams migration failed");
            fs.writeFileSync(path, source);
          }

          fs.rmSync(".github/workflows/online-next15-upgrade.yml");
          NODE
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate generated dependency tree
        run: npm ls next react react-dom eslint-config-next
      - name: Commit the online-only upgrade batch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app .github/workflows/online-next15-upgrade.yml
          git commit -m "Upgrade to patched Next.js 15"
          git push origin HEAD:phase-5/next15-security-upgrade
