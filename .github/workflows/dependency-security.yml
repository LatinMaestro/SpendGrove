name: Production dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install the exact locked dependency tree
        run: npm ci --ignore-scripts
      - name: Confirm lockfile consistency
        run: git diff --exit-code -- package-lock.json
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Confirm framework versions
        run: npm ls next react react-dom eslint-config-next
