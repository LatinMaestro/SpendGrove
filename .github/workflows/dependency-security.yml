name: Production dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate dependency lockfile without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Commit generated lockfile to this pull request branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add deterministic dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Confirm framework versions
        run: npm ls next react react-dom eslint-config-next
