name: Production dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate dependency lockfile without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Publish generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: spendgrove-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Confirm framework versions
        run: npm ls next react react-dom eslint-config-next
